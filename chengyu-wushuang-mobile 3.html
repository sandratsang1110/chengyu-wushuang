<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071126"><title>成語無雙：墨城之戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#061025;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;touch-action:none}.app{max-width:1000px;margin:auto;padding:9px}.head{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 8px}.title{font-size:clamp(21px,5vw,32px);font-weight:900;letter-spacing:.08em;text-shadow:0 0 15px #66e5f2}.hint{font-size:12px;color:#bcd1f5}.hud{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-bottom:7px}.box{background:#0b1832;border:1px solid #416699;border-radius:10px;padding:7px 9px}.lab{font-size:11px;color:#adc7ed}.val{font-size:15px;font-weight:800}.bar{height:8px;background:#253653;border-radius:8px;overflow:hidden;margin:4px 0}.fill{height:100%;border-radius:8px;transition:width .2s}.hp{background:linear-gradient(90deg,#5aebee,#7bf0a7)}.enemy{background:linear-gradient(90deg,#ffd15f,#ef5c70)}.stage{position:relative;border:1px solid #4d70a4;border-radius:14px;overflow:hidden;box-shadow:0 15px 30px #000a}.stage canvas{display:block;width:100%;height:auto}.controlNote{text-align:center;color:#c4d7f0;font-size:11px;margin:6px}.touch{display:none;position:absolute;inset:0;pointer-events:none}.pad,.attack{position:absolute;bottom:14px;pointer-events:auto;user-select:none}.pad{left:16px;width:122px;height:122px;border-radius:50%;background:#09182bc5;border:1px solid #6682b1}.knob{position:absolute;left:39px;top:39px;width:43px;height:43px;border-radius:50%;background:#406da4bb;border:1px solid #9bc8ff}.attack{right:19px;width:76px;height:76px;border-radius:50%;border:2px solid #ff9d9d;background:#8b334ccf;color:white;font-size:22px;font-weight:900;box-shadow:0 0 20px #ff687877}.modal{position:fixed;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:#020714c9}.modal.hide{display:none}.card{width:min(570px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#182e55,#09142c);border:1px solid #678cc0;border-radius:17px;padding:20px;text-align:center;box-shadow:0 20px 40px #000b}.card h1{font-size:26px;margin:0 0 8px}.card p{line-height:1.6;color:#d8e8ff}.go,.ans{font:inherit;border-radius:10px;cursor:pointer}.go{border:0;background:linear-gradient(135deg,#ffe184,#eaa132);padding:11px 18px;font-weight:900;color:#291900}.question{text-align:left}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ans{border:1px solid #5e82b6;background:#1a355e;color:white;padding:10px;text-align:left;font-weight:700}.ans:disabled{cursor:default}.ans.good{background:#177852}.ans.bad{background:#8a334a}.explain{min-height:48px;margin:11px 0;line-height:1.55;color:#e4efff}@media(max-width:650px){.app{padding:6px}.hint{display:none}.hud{grid-template-columns:1fr 1fr}.box:last-child{grid-column:1/-1}.touch{display:block}.controlNote{font-size:10px}.answers{grid-template-columns:1fr}.card{padding:16px}.card h1{font-size:23px}}
</style></head><body><div class="app"><div class="head"><div class="title">成語無雙：墨城之戰</div><div class="hint">WASD／方向鍵＋空白鍵／J</div></div><div class="hud"><div class="box"><div class="lab">守城者生命</div><div class="bar"><div id="hpbar" class="fill hp"></div></div><div id="hp" class="val">100 / 100</div></div><div class="box"><div id="waveLabel" class="lab">第 1 波・錯字妖兵</div><div class="bar"><div id="wavebar" class="fill enemy"></div></div><div id="alive" class="val">0 隻敵人</div></div><div class="box"><div class="lab">分數／連擊／墨卷</div><div class="val"><span id="score">0</span>／<span id="combo">0</span>／<span id="scroll">0/3</span></div></div></div><div class="stage"><canvas id="c" width="960" height="540"></canvas><div class="touch"><div id="pad" class="pad"><div id="knob" class="knob"></div></div><button id="attack" class="attack">斬</button></div></div><div class="controlNote">手機：左下拖動移動，右下「斬」攻擊　｜　打怪撿墨卷，集齊 3 卷答成語題</div></div><div id="modal" class="modal"><div id="card" class="card"></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=C.width,H=C.height,$=id=>document.getElementById(id);let run=false,pause=false,last=0,time=0,score=0,combo=0,wave=1,scrolls=0,shake=0,flash=0,questionIndex=0;let keys={},touch={x:0,y:0},target=null,es=[],ds=[],ps=[],ts=[];const p={x:480,y:390,hp:100,dir:0,attack:0,inv:0,tr:[]};const qs=[{q:'「畫蛇添足」最接近哪個意思？',a:['做多餘事，反而弄巧成拙','把蛇畫得很漂亮','做事十分細心','勇敢完成任務'],ok:0,e:'畫蛇添足：比喻做了多餘的事，反而把事情弄壞。'},{q:'小婷平日低調，卻在朗誦比賽奪冠。最適合用：',a:['守株待兔','一鳴驚人','杯弓蛇影','自相矛盾'],ok:1,e:'一鳴驚人：平時沒有突出表現，卻突然作出驚人成績。'},{q:'「守株待兔」告訴我們甚麼？',a:['要等運氣來','不可死守舊法，妄想不勞而獲','兔子跑得很快','要多種樹'],ok:1,e:'守株待兔：比喻死守狹隘經驗，不知變通。'},{q:'前後說法互相衝突，應用哪個成語？',a:['胸有成竹','見賢思齊','自相矛盾','水落石出'],ok:2,e:'自相矛盾：說話或行動前後抵觸，不能自圓其說。'}];
function modal(html){$('modal').classList.remove('hide');$('card').innerHTML=html}function start(){score=combo=scrolls=0;wave=1;p.hp=100;p.x=480;p.y=390;es=[];ds=[];ps=[];ts=[];run=true;pause=false;$('modal').classList.add('hide');spawnWave();requestAnimationFrame(loop)}function spawnWave(){let n=wave===3?1:7+wave*2;for(let i=0;i<n;i++){let boss=wave===3;es.push({x:boss?480:45+Math.random()*870,y:boss?120:55+Math.random()*180,r:boss?33:15,hp:boss?52:4+wave,max:boss?52:4+wave,sp:boss?40:37+wave*7,boss,hit:0})}note(wave===3?'⚠ 望文生義魔王現身！':'第 '+wave+' 波・錯字妖兵來襲','#ffe283')}
function loop(t){if(!run)return;let d=Math.min(.033,(t-last)/1000||.016);last=t;if(!pause)upd(d);draw();requestAnimationFrame(loop)}function upd(d){time+=d;p.inv=Math.max(0,p.inv-d);p.attack=Math.max(0,p.attack-d);let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+touch.x,my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+touch.y;if(target){let dx=target.x-p.x,dy=target.y-p.y,z=Math.hypot(dx,dy);if(z>8){mx=dx/z;my=dy/z}else target=null}if(mx||my){let z=Math.hypot(mx,my);p.x+=mx/z*205*d;p.y+=my/z*205*d;p.dir=Math.atan2(my,mx)}p.x=Math.max(24,Math.min(W-24,p.x));p.y=Math.max(70,Math.min(H-28,p.y));p.tr.push({x:p.x,y:p.y});if(p.tr.length>11)p.tr.shift();for(let i=es.length-1;i>=0;i--){let e=es[i],dx=p.x-e.x,dy=p.y-e.y,z=Math.hypot(dx,dy)||1;e.x+=dx/z*e.sp*d;e.y+=dy/z*e.sp*d;e.hit=Math.max(0,e.hit-d);if(z<e.r+21&&p.inv<=0){p.hp-=e.boss?13:7;p.inv=.65;combo=0;shake=12;burst(p.x,p.y,'#ff6b7e',15);note('−'+(e.boss?13:7),p.x,p.y-26,'#ff9da9');if(p.hp<=0){end(false);return}}if(p.attack>0&&z<e.r+83){e.hp-=e.boss?1.6:2.6;e.x-=dx/z*30;e.y-=dy/z*30;e.hit=.12;burst(e.x,e.y,'#ffe580',5);if(e.hp<=0){es.splice(i,1);score+=e.boss?700:60+combo*4;burst(e.x,e.y,e.boss?'#ffd264':'#66f0ff',e.boss?42:16);note(e.boss?'魔王擊破！':'＋'+(60+combo*4),e.x,e.y-20,'#ffe388');for(let j=0;j<(e.boss?5:1);j++)ds.push({x:e.x+(Math.random()-.5)*18,y:e.y+(Math.random()-.5)*18,a:0})}}}for(let i=ds.length-1;i>=0;i--){let q=ds[i];q.a+=d*5;let z=Math.hypot(p.x-q.x,p.y-q.y);if(z<72){q.x+=(p.x-q.x)*5*d;q.y+=(p.y-q.y)*5*d}if(z<24){ds.splice(i,1);scrolls++;score+=25;note('+墨卷',p.x,p.y-30,'#8cfcff');if(scrolls>=3){quiz();return}}}for(let i=ps.length-1;i>=0;i--){let q=ps[i];q.x+=q.vx*d;q.y+=q.vy*d;q.vy+=70*d;q.life-=d;if(q.life<=0)ps.splice(i,1)}for(let i=ts.length-1;i>=0;i--){ts[i].y-=28*d;ts[i].life-=d;if(ts[i].life<=0)ts.splice(i,1)}shake=Math.max(0,shake-28*d);flash=Math.max(0,flash-d);if(es.length===0){wave++;if(wave>3){end(true);return}setTimeout(spawnWave,700)}}
function strike(){if(!run||pause||p.attack>0)return;p.attack=.22;combo++;shake=4}function burst(x,y,col,n){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=35+Math.random()*150;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,life:.25+Math.random()*.45,col,r:2+Math.random()*4})}}function note(t,x,y,col){if(typeof x==='string'){ts.push({x:W/2,y:155,t,life:2,col:x,big:true})}else ts.push({x,y,t,life:1,col})}
function quiz(){pause=true;let q=qs[questionIndex++%qs.length];modal('<div class="question"><h1>📜 成語奧義</h1><p>'+q.q+'</p><div id="answers" class="answers"></div><div id="explain" class="explain"></div><button id="continue" class="go" style="display:none">繼續戰鬥 →</button></div>');q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=String.fromCharCode(65+i)+'．'+a;b.onclick=()=>{document.querySelectorAll('.ans').forEach(v=>v.disabled=true);document.querySelectorAll('.ans')[q.ok].classList.add('good');if(i===q.ok){b.classList.add('good');$('explain').innerHTML='<b>答對！字義天雷發動！</b><br>'+q.e;ultimate()}else{b.classList.add('bad');$('explain').innerHTML='<b>正確答案：</b>'+q.a[q.ok]+'<br>'+q.e;p.hp=Math.max(1,p.hp-12)}$('continue').style.display='inline-block'}});$('continue').onclick=()=>{$('modal').classList.add('hide');scrolls=0;pause=false}}
function ultimate(){score+=250;combo+=5;flash=.65;for(let i=es.length-1;i>=0;i--){let e=es[i];es.splice(i,1);burst(e.x,e.y,'#fff1a2',22);for(let j=0;j<(e.boss?5:1);j++)ds.push({x:e.x,y:e.y,a:0})}}
function end(win){run=false;pause=true;modal('<h1>'+ (win?'🏆 墨城大捷！':'💥 城門失守…')+'</h1><p>最終分數：<b>'+score+'</b><br>重新守城，再挑戰更高連擊！</p><button class="go" onclick="start()">重新開始</button>')}
function draw(){X.clearRect(0,0,W,H);let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;X.save();X.translate(sx,sy);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#294b77');g.addColorStop(.55,'#11284d');g.addColorStop(1,'#071426');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='#fff1b3';X.beginPath();X.arc(808,74,40,0,6.28);X.fill();for(let i=0;i<28;i++){X.fillStyle='rgba(220,241,255,.7)';X.fillRect((i*137)%W,25+(i*67)%200,2,2)}X.fillStyle='#172a48';for(let i=0;i<5;i++){let z=i*230-80;X.beginPath();X.moveTo(z,345);X.lineTo(z+120,135);X.lineTo(z+290,345);X.fill()}X.fillStyle='#18372f';X.fillRect(0,350,W,190);X.strokeStyle='rgba(105,188,131,.25)';for(let i=0;i<W;i+=37){X.beginPath();X.moveTo(i,353);X.lineTo(i-74,H);X.stroke()}for(let q of ds){X.save();X.translate(q.x,q.y+Math.sin(q.a)*4);X.rotate(q.a*.3);X.fillStyle='#f8dc83';X.fillRect(-8,-10,16,20);X.strokeStyle='#855d26';X.strokeRect(-8,-10,16,20);X.fillStyle='#754c1f';X.font='bold 12px serif';X.textAlign='center';X.fillText('墨',0,5);X.restore()}for(let e of es){X.save();X.translate(e.x,e.y);let s=e.boss?1.5:1;X.scale(s,s);X.fillStyle=e.hit>0?'#fff5a7':e.boss?'#d95672':'#ae536b';X.beginPath();X.arc(0,0,e.r/s,0,6.28);X.fill();X.fillStyle='#35172d';X.fillRect(-e.r/s*.65,e.r/s*.45,e.r/s*1.3,e.r/s*.5);X.fillStyle='white';X.fillRect(-7,-4,4,4);X.fillRect(4,-4,4,4);X.restore();if(e.boss||e.hp<e.max){X.fillStyle='#101c30';X.fillRect(e.x-23,e.y-e.r-14,46,5);X.fillStyle=e.boss?'#ffcf62':'#f36a78';X.fillRect(e.x-23,e.y-e.r-14,46*e.hp/e.max,5)}}for(let q of p.tr){X.globalAlpha=.06;X.fillStyle='#64e8f4';X.beginPath();X.arc(q.x,q.y,20,0,6.28);X.fill()}X.globalAlpha=1;X.save();X.translate(p.x,p.y);X.rotate(p.dir);if(!(p.inv>0&&Math.floor(time*12)%2===0)){X.fillStyle='#3ee4e8';X.beginPath();X.arc(0,0,20,0,6.28);X.fill();X.fillStyle='#e5fbff';X.beginPath();X.arc(3,-5,8,0,6.28);X.fill();X.fillStyle='#192b49';X.fillRect(-15,13,30,13);X.strokeStyle='#f8e7a5';X.lineWidth=6;X.beginPath();X.moveTo(14,-1);X.lineTo(48,-1);X.stroke();if(p.attack>0){X.strokeStyle='rgba(255,231,132,.9)';X.lineWidth=9;X.beginPath();X.arc(0,0,69,-.88,.88);X.stroke()}}X.restore();for(let q of ps){X.globalAlpha=Math.max(0,q.life*2);X.fillStyle=q.col;X.fillRect(q.x-q.r/2,q.y-q.r/2,q.r,q.r)}X.globalAlpha=1;for(let q of ts){X.globalAlpha=Math.min(1,q.life*2);X.fillStyle=q.col;X.font=(q.big?'bold 26px':'bold 17px')+' sans-serif';X.textAlign='center';X.fillText(q.t,q.x,q.y)}X.restore();if(flash>0){X.fillStyle='rgba(255,245,165,'+(flash*.52)+')';X.fillRect(0,0,W,H)}$('hpbar').style.width=Math.max(0,p.hp)+'%';$('hp').textContent=Math.max(0,Math.ceil(p.hp))+' / 100';let max=wave===3?1:7+wave*2;$('wavebar').style.width=Math.max(0,es.length/max*100)+'%';$('waveLabel').textContent=wave===3?'魔王血量':'第 '+wave+' 波・錯字妖兵';$('alive').textContent=wave===3?'望文生義魔王':'剩餘 '+es.length+' 隻';$('score').textContent=score;$('combo').textContent=combo;$('scroll').textContent=scrolls+'/3'}
addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','j','J'].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='j'||e.key==='J')strike()});addEventListener('keyup',e=>keys[e.key]=false);let pad=$('pad'),knob=$('knob');function padMove(e){let r=pad.getBoundingClientRect(),a=e.touches?e.touches[0]:e,dx=a.clientX-(r.left+r.width/2),dy=a.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),k=Math.min(1,m/43);touch.x=dx/(m||1)*k;touch.y=dy/(m||1)*k;knob.style.left=(39+touch.x*35)+'px';knob.style.top=(39+touch.y*35)+'px'}pad.addEventListener('touchstart',e=>{e.preventDefault();padMove(e)},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();padMove(e)},{passive:false});pad.addEventListener('touchend',()=>{touch.x=touch.y=0;knob.style.left='39px';knob.style.top='39px'});$('attack').addEventListener('touchstart',e=>{e.preventDefault();strike()},{passive:false});modal('<h1>🏯 成語無雙：墨城之戰</h1><p>手機可直接玩：左下拖動移動，右下按「斬」攻擊。<br>打倒妖兵、撿墨卷；集齊 3 卷就答成語題並發動必殺技！</p><button class="go" onclick="start()">開始守城</button>');
</script></body></html>
